global:
  scrape_interval: 2s
  evaluation_interval: 2s

rule_files:
  - /etc/prometheus/rules.yml
  
scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8002"]

  - job_name: backend
    static_configs:
      - targets: ["backend:8003"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres:8004"]