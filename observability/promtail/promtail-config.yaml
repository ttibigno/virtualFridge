# Tails Docker container stdout via the Docker socket and ships to Loki.
# Each line is labeled by the compose service name, so LogQL queries like
# {service="api"} | logfmt | status="500" Just Work.

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    
    relabel_configs:
      - source_labels: 
        - __meta_docker_container_label_com_docker_compose_project
        regex: fridge
        action: keep
      - source_labels:
        - __meta_docker_container_label_com_docker_compose_service
        target_label: service_name
      - source_labels:
        - __meta_docker_container_name
        regex: "/(.*)"
        target_label: container